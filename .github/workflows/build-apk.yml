name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: '4.7.2'
      ANDROID_COMPILE_SDK: '35'
      ANDROID_BUILD_TOOLS: '35.0.1'
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" \
                     "build-tools;${ANDROID_BUILD_TOOLS}" \
                     "platforms;android-${ANDROID_COMPILE_SDK}"

      # ---- Godot mono editor ------------------------------------------------
      - name: Download Godot (mono) editor
        run: |
          mkdir -p godot-dir
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip -d godot-dir
          chmod +x godot-dir/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64
          echo "$(pwd)/godot-dir" >> "$GITHUB_PATH"
          rm godot.zip

      # ---- Export templates (cached: they are ~1.1 GB) ----------------------
      - name: Cache Godot export templates
        id: tpl-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-mono

      - name: Download export templates
        if: steps.tpl-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          cd "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          curl -sSL -o t.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -o -q t.tpz \
            'templates/android_debug.apk' \
            'templates/android_release.apk' \
            'templates/version.txt'
          mv templates/* . && rmdir templates && rm t.tpz

      # ---- Build -------------------------------------------------------------
      - name: Import project
        run: godot --headless --path . --import

      - name: Build C# assembly
        run: dotnet build NeonDash.csproj -c Release --nologo

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/NeonDash-debug.apk

      - name: Verify APK
        run: |
          APK=build/NeonDash-debug.apk
          test -f "$APK" || { echo "APK missing"; exit 1; }
          echo "--- identity ---"
          aapt dump badging "$APK" 2>/dev/null | grep -E '^package:|^sdkVersion:|^targetSdkVersion:|application-label:' | head -5
          echo "--- launcher alias ---"
          aapt dump xmltree "$APK" AndroidManifest.xml 2>/dev/null | grep -A1 'GodotAppLauncher' | head -3
          echo "--- signature ---"
          apksigner verify --print-certs "$APK" 2>&1 | head -3
          echo "--- arm64 native libs ---"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/(libgodot_android|libmonosgen)' | head -3
          echo "--- game assembly ---"
          unzip -l "$APK" | grep 'NeonDash.dll'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neon-dash-apk
          path: build/*.apk
          if-no-files-found: error
