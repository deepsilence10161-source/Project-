name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: '4.7.2'
      ANDROID_COMPILE_SDK: '35'
      ANDROID_BUILD_TOOLS: '35.0.1'
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships an Android SDK, but the
      # android-actions/setup-android@v3 action is broken: it asks sdkmanager
      # for the long-removed legacy 'tools' package and dies with exit code 1.
      # So we locate the pre-installed SDK (and install cmdline-tools ourselves
      # as a fallback) instead of using that action.
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ] && \
             ! ls "$SDK"/cmdline-tools/*/bin/sdkmanager > /dev/null 2>&1; then
            echo "No pre-installed cmdline-tools at $SDK -> installing them"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/clt.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            rm /tmp/clt.zip
          fi
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "Using sdkmanager: $SM"
          export PATH="$(dirname "$SM"):$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" \
                     "build-tools;${ANDROID_BUILD_TOOLS}" \
                     "platforms;android-${ANDROID_COMPILE_SDK}"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "$(dirname "$SM")" >> "$GITHUB_PATH"
          } >> "$GITHUB_ENV"
          echo "SDK ready at $SDK"

      # ---- Godot mono editor ------------------------------------------------
      - name: Download Godot (mono) editor
        run: |
          mkdir -p godot-dir
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip -d godot-dir
          chmod +x godot-dir/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64
          echo "$(pwd)/godot-dir" >> "$GITHUB_PATH"
          rm godot.zip

      # ---- Export templates (cached: they are ~1.1 GB) ----------------------
      - name: Cache Godot export templates
        id: tpl-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-mono

      - name: Download export templates
        if: steps.tpl-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          cd "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          curl -sSL -o t.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -o -q t.tpz \
            'templates/android_debug.apk' \
            'templates/android_release.apk' \
            'templates/version.txt'
          mv templates/* . && rmdir templates && rm t.tpz

      # ---- Build -------------------------------------------------------------
      - name: Import project
        run: godot --headless --path . --import

      - name: Build C# assembly
        run: dotnet build NeonDash.csproj -c Debug --nologo

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/NeonDash-debug.apk

      - name: Verify APK
        run: |
          APK=build/NeonDash-debug.apk
          test -f "$APK" || { echo "APK missing"; exit 1; }
          echo "--- identity ---"
          aapt dump badging "$APK" 2>/dev/null | grep -E '^package:|^sdkVersion:|^targetSdkVersion:|application-label:' | head -5
          echo "--- launcher alias ---"
          aapt dump xmltree "$APK" AndroidManifest.xml 2>/dev/null | grep -A1 'GodotAppLauncher' | head -3
          echo "--- signature ---"
          apksigner verify --print-certs "$APK" 2>&1 | head -3
          echo "--- arm64 native libs ---"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/(libgodot_android|libmonosgen)' | head -3
          echo "--- game assembly ---"
          unzip -l "$APK" | grep 'NeonDash.dll'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neon-dash-apk
          path: build/*.apk
          if-no-files-found: error
