name: Emulator E2E

# Boots an Android emulator on GitHub's runner, installs the debug APK and
# PLAYS the game with real touch input: start, swipe left/right, jump, crash
# into an obstacle, retry.
#
# Godot draws into one native surface, so UI-automation tools (Maestro,
# Appium) cannot see inside the game. Instead the debug build reports its own
# events to logcat ("ND_EVT ...", Scripts/TestProbe.cs); ci/e2e/judge.py
# asserts on those events + screenshots. The job is red unless every check
# passes. Report: https://deepsilence10161-source.github.io/Project-/e2e/
#
# Emulator setup = the one proven in Render Lab v3 (12/12 runs):
#   API 34 AOSP 'default' x86_64, Nexus 4, 4 cores, 4 GB, -gpu lavapipe.

on:
  push:
    branches: [main, 'phase-*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emulator-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Play the game on an Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: '4.7.2'
      ANDROID_API_LEVEL: '34'
      ANDROID_COMPILE_SDK: '35'
      ANDROID_BUILD_TOOLS: '35.0.1'
    steps:
      - uses: actions/checkout@v4

      # ---------- build the APK first ----------
      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android@v3 is unusable: it asks sdkmanager for
      # the long-removed legacy 'tools' package and exits 1. ubuntu-latest
      # already ships an SDK, so locate it and install cmdline-tools only
      # as a fallback.
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ] && \
             ! ls "$SDK"/cmdline-tools/*/bin/sdkmanager > /dev/null 2>&1; then
            echo "No pre-installed cmdline-tools at $SDK -> installing them"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/clt.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            rm /tmp/clt.zip
          fi
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "Using sdkmanager: $SM"
          export PATH="$(dirname "$SM"):$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;${ANDROID_BUILD_TOOLS}" "platforms;android-${ANDROID_COMPILE_SDK}"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "SDK_DIR=$SDK"
            echo "$(dirname "$SM")" >> "$GITHUB_PATH"
          } >> "$GITHUB_ENV"
          echo "SDK ready at $SDK"

      # Same two defects as build-apk.yml had: the release zip unpacks into a
      # nested Godot_v<version>-stable_mono_linux_x86_64/ directory, and the
      # binary is not named `godot`. Both are fixed here.
      - name: Download Godot (mono) editor
        run: |
          set -euo pipefail
          mkdir -p godot-dir
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip -d godot-dir
          BIN="godot-dir/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          test -x "$BIN" || { echo "Godot binary not found at $BIN"; ls -la godot-dir; exit 1; }
          chmod +x "$BIN"
          ln -sf "$(basename "$BIN")" "godot-dir/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/godot"
          echo "$(pwd)/godot-dir/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64" >> "$GITHUB_PATH"
          rm godot.zip
          echo "Godot binary ready: $BIN"
          # $GITHUB_PATH only applies to later steps, so verify via the
          # symlink's own path rather than `command -v godot`.
          "godot-dir/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/godot" --headless --version

      # The Android exporter refuses to export unless Editor Settings point at
      # a valid JDK and Android SDK, even on this project's legacy template
      # export path (use_gradle_build=false). A headless run has no GUI.
      - name: Configure Godot editor settings
        shell: bash
        env:
          SDK_DIR: ${{ env.SDK_DIR }}
          JAVA_HOME_DIR: ${{ env.JAVA_HOME }}
        run: |
          set -euo pipefail
          SDK="${SDK_DIR:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          JAVA="${JAVA_HOME_DIR:-${JAVA_HOME:-}}"
          [ -n "$JAVA" ] || { echo "::error::JAVA_HOME empty"; exit 1; }
          test -x "$JAVA/bin/java" || { echo "::error::$JAVA/bin/java missing"; exit 1; }
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Cache Godot export templates
        id: tpl-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-mono

      - name: Download export templates
        if: steps.tpl-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          cd "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          curl -sSL -o t.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -o -q t.tpz 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/version.txt'
          mv templates/* . && rmdir templates && rm t.tpz

      # The shipped preset is arm64 only (phones). The x86_64 emulator needs an
      # x86_64 slice too, so the TEST APK enables it here, in CI only.
      - name: Import and build
        run: |
          sed -i 's/^architectures\/x86_64=false/architectures\/x86_64=true/' export_presets.cfg
          grep -n '^architectures/' export_presets.cfg
          godot --headless --path . --import
          dotnet build NeonDash.csproj -c Debug --nologo
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/NeonDash-debug.apk

      # ---------- play it on an emulator ----------
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Play the game (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: default
          arch: x86_64
          profile: Nexus 4
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -gpu lavapipe -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash ci/e2e/run.sh

      - name: Judge
        if: always()
        run: |
          mkdir -p out
          python3 -m pip install -q pillow
          python3 ci/e2e/judge.py out

      - name: Build report
        if: always()
        run: python3 ci/e2e/report.py out site "${{ github.run_number }}" "${{ github.sha }}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-e2e-results
          path: |
            out/
            site/
          retention-days: 14
          if-no-files-found: warn

      - name: Publish report (gh-pages/e2e)
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: true

      # The honest gate: red unless judge.py passed every single check.
      - name: Verdict
        if: always()
        run: |
          python3 - <<'PY'
          import json, sys
          r = json.load(open("out/result.json"))
          for c in r["checks"]:
              if not c["ok"]:
                  print(f"::error::{c['key']}: {c['evidence']}")
          print(f"{r['verdict']} {r['passed']}/{r['total']}")
          sys.exit(0 if r["verdict"] == "PASS" else 1)
          PY
