name: Emulator E2E

# Boots a real Android emulator on GitHub's runner, installs the APK,
# drives it with Maestro touch input and captures screenshots.
# The screenshots are published to GitHub Pages so they can be
# reviewed from a phone browser.
#
# HONEST SCOPE: Godot renders the whole game into a single native canvas
# and publishes no accessibility tree, so Maestro can see nothing inside
# the game. This workflow therefore proves: the APK installs, launches,
# stays alive under touch input, and shows what it looks like. It cannot
# assert on in-game score, lane position or collision.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: emulator-e2e
  cancel-in-progress: true

jobs:
  e2e:
    name: Maestro on Android emulator
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: '4.7.2'
      ANDROID_API_LEVEL: '34'
      ANDROID_COMPILE_SDK: '35'
      ANDROID_BUILD_TOOLS: '35.0.1'
    steps:
      - uses: actions/checkout@v4

      # ---------- build the APK first ----------
      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android@v3 is unusable: it asks sdkmanager for
      # the long-removed legacy 'tools' package and exits 1. ubuntu-latest
      # already ships an SDK, so locate it and install cmdline-tools only
      # as a fallback.
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ] && \
             ! ls "$SDK"/cmdline-tools/*/bin/sdkmanager > /dev/null 2>&1; then
            echo "No pre-installed cmdline-tools at $SDK -> installing them"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/clt.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            rm /tmp/clt.zip
          fi
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "Using sdkmanager: $SM"
          export PATH="$(dirname "$SM"):$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;${ANDROID_BUILD_TOOLS}" "platforms;android-${ANDROID_COMPILE_SDK}"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "SDK_DIR=$SDK"
            echo "$(dirname "$SM")" >> "$GITHUB_PATH"
          } >> "$GITHUB_ENV"
          echo "SDK ready at $SDK"

      # Same two defects as build-apk.yml had: the release zip unpacks into a
      # nested Godot_v<version>-stable_mono_linux_x86_64/ directory, and the
      # binary is not named `godot`. Both are fixed here.
      - name: Download Godot (mono) editor
        run: |
          set -euo pipefail
          mkdir -p godot-dir
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip -d godot-dir
          BIN="godot-dir/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          test -x "$BIN" || { echo "Godot binary not found at $BIN"; ls -la godot-dir; exit 1; }
          chmod +x "$BIN"
          ln -sf "$(basename "$BIN")" "godot-dir/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/godot"
          echo "$(pwd)/godot-dir/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64" >> "$GITHUB_PATH"
          rm godot.zip
          echo "Godot binary ready: $BIN"
          # $GITHUB_PATH only applies to later steps, so verify via the
          # symlink's own path rather than `command -v godot`.
          "godot-dir/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/godot" --headless --version

      # The Android exporter refuses to export unless Editor Settings point at
      # a valid JDK and Android SDK, even on this project's legacy template
      # export path (use_gradle_build=false). A headless run has no GUI.
      - name: Configure Godot editor settings
        shell: bash
        env:
          SDK_DIR: ${{ env.SDK_DIR }}
          JAVA_HOME_DIR: ${{ env.JAVA_HOME }}
        run: |
          set -euo pipefail
          SDK="${SDK_DIR:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          JAVA="${JAVA_HOME_DIR:-${JAVA_HOME:-}}"
          [ -n "$JAVA" ] || { echo "::error::JAVA_HOME empty"; exit 1; }
          test -x "$JAVA/bin/java" || { echo "::error::$JAVA/bin/java missing"; exit 1; }
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Cache Godot export templates
        id: tpl-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-mono

      - name: Download export templates
        if: steps.tpl-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          cd "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          curl -sSL -o t.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -o -q t.tpz 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/version.txt'
          mv templates/* . && rmdir templates && rm t.tpz

      - name: Import and build
        run: |
          godot --headless --path . --import
          dotnet build NeonDash.csproj -c Debug --nologo
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/NeonDash-debug.apk

      # ---------- run on a real emulator ----------
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro smoke flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set +e
            APP=com.neondash.game
            APK=build/NeonDash-debug.apk

            echo "=== installing APK ==="
            adb install -r "$APK"
            echo "install rc=$?"

            curl -fsSL "https://get.maestro.mobile.dev" | bash
            export PATH="$HOME/.maestro/bin:$PATH"
            maestro --version

            echo "=== running Maestro smoke flow ==="
            maestro test .maestro/flows/smoke.yaml \
              --format junit --output maestro-report.xml
            MAESTRO_RC=$?
            echo "maestro exit code: $MAESTRO_RC"

            mkdir -p screenshots
            find .maestro -name '*.png' -exec cp {} screenshots/ \; 2>/dev/null
            adb exec-out screencap -p > screenshots/09-final-device-screen.png 2>/dev/null
            adb logcat -d > logcat.txt 2>/dev/null

            echo "=== liveness: is the game process alive right now? ==="
            PID=$(adb shell pidof $APP | tr -d '\r\n')
            if [ -n "$PID" ]; then
              echo "ALIVE: $APP pid=$PID"
              echo "alive" > .app-state
            else
              echo "DEAD: $APP is not running"
              echo "dead" > .app-state
            fi

            echo "=== crash scan in logcat ==="
            if grep -qE 'FATAL EXCEPTION|Process: '"$APP"', PID' logcat.txt 2>/dev/null; then
              echo "CRASH SIGNATURE FOUND:"
              grep -nE 'FATAL EXCEPTION|Process: '"$APP"', PID' logcat.txt | head -20
              echo "crashed" > .crash-state
            else
              echo "no crash signatures in logcat"
              echo "clean" > .crash-state
            fi

            echo "=== summary ==="
            cat .app-state .crash-state
            # Never fail this step: the report must always be published.
            exit 0

      - name: Collect results
        if: always()
        run: |
          mkdir -p report/screenshots
          cp -r screenshots/* report/screenshots/ 2>/dev/null || true
          [ -f maestro-report.xml ] && cp maestro-report.xml report/ || true
          [ -f logcat.txt ] && cp logcat.txt report/ || true
          {
            echo "app state : $(cat .app-state 2>/dev/null || echo unknown)"
            echo "crash scan: $(cat .crash-state 2>/dev/null || echo unknown)"
          } > report/status.txt
          cat report/status.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-e2e-results
          path: report/
          if-no-files-found: warn

      # ---------- publish to GitHub Pages ----------
      - name: Build report index
        if: always()
        run: |
          cat > report/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Neon Dash - E2E report</title>
          <style>
            body{background:#0a0a1f;color:#e8e8ff;font-family:system-ui,sans-serif;margin:0;padding:20px}
            h1{color:#00f0ff;font-size:22px}
            h2{color:#00f0ff;font-size:16px;margin-top:24px}
            .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
            figure{margin:0;background:#14142b;border-radius:10px;overflow:hidden}
            img{width:100%;display:block}
            figcaption{padding:8px 10px;font-size:13px;color:#9a9ac8}
            a{color:#00f0ff}
            pre{background:#14142b;padding:12px;border-radius:8px;overflow-x:auto;font-size:12px}
          </style></head><body>
          <h1>Neon Dash - emulator E2E screenshots</h1>
          <p>Run: ${{ github.run_number }} &middot; <a href="../">repo</a></p>
          <h2>Status</h2>
          <pre>$(cat report/status.txt 2>/dev/null)</pre>
          <h2>Screenshots</h2>
          <div class="g">
          HTML
          for f in report/screenshots/*.png; do
            [ -e "$f" ] || continue
            n=$(basename "$f")
            echo "<figure><img src=\"screenshots/$n\" loading=\"lazy\"><figcaption>$n</figcaption></figure>" >> report/index.html
          done
          echo '</div></body></html>' >> report/index.html

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./report
          publish_branch: gh-pages
          keep_files: true
